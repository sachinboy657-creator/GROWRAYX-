<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM - Custom Quest + Timer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',monospace}
body{background:#02060e;color:#fff;min-height:100vh}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%, #0a2a5a 0%, #02060e 70%);z-index:-1}
.header{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #0ff3;align-items:center}
.logo{color:#00e5ff;font-weight:900;text-shadow:0 0 15px #00e5ff;font-size:13px}
.right{display:flex;gap:8px;align-items:center}
.timer{border:1px solid #ff2a2a;color:#ff2a2a;padding:6px 10px;border-radius:20px;font-size:10px;box-shadow:0 0 10px #ff2a2a}
.setBtn{border:1px solid #00e5ff;color:#00e5ff;background:#00e5ff1a;padding:6px 10px;border-radius:20px;font-size:10px;cursor:pointer}
.container{max-width:430px;margin:0 auto;padding:16px}
.title{font-size:26px;text-align:center;font-weight:900;letter-spacing:3px;text-shadow:0 0 20px #00e5ff}
.sub{text-align:center;color:#888;font-size:10px;letter-spacing:2px;margin:6px 0 14px}
.addBox{display:flex;gap:8px;margin-bottom:14px}
.addBox input{flex:1;background:#0a1430;border:1px solid #1a3a7a;color:#fff;padding:14px;border-radius:12px;outline:none;font-size:13px}
.addBox button{background:linear-gradient(90deg,#00e5ff,#5a00ff);border:none;color:#fff;padding:0 18px;border-radius:12px;font-weight:900;cursor:pointer}
.timeBox{background:#0a1430;border:1px solid #00e5ff33;border-radius:12px;padding:12px;display:none;margin-bottom:14px}
.timeBox.show{display:block}
.timeBox h4{font-size:11px;color:#00e5ff;margin-bottom:8px;letter-spacing:1px}
.timeInputs{display:flex;gap:8px}
.timeInputs input{flex:1;background:#02060e;border:1px solid #1a3a7a;color:#fff;padding:10px;border-radius:8px;text-align:center}
.timeInputs button{background:#00e5ff;color:#000;border:none;padding:10px 16px;border-radius:8px;font-weight:900;cursor:pointer}
.bar{width:100%;height:8px;background:#111;border-radius:10px;overflow:hidden;margin-bottom:6px;border:1px solid #222}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#7a00ff);transition:0.5s;box-shadow:0 0 15px #00e5ff}
.count{text-align:center;font-size:11px;color:#888;margin-bottom:16px;letter-spacing:2px}
.card{background:linear-gradient(180deg,#0a1430,#060d20);border:1px solid #1a2a5a;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card.done{border-color:#00e5ff;box-shadow:0 0 20px #00e5ff66}
.left{display:flex;gap:10px;align-items:center;flex:1}
.num{width:28px;height:28px;background:#111;border:1px solid #333;border-radius:6px;display:grid;place-items:center;font-size:10px;color:#00e5ff}
.name{font-size:12px;flex:1;background:transparent;border:none;color:#fff;outline:none}
.actions{display:flex;gap:8px}
.check{width:32px;height:32px;border:2px solid #2a3a6a;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.del{color:#ff4444;background:#ff44441a;border:1px solid #ff44444a;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(90deg,#00e5ff,#5a00ff);color:#fff;font-weight:900;letter-spacing:2px;font-size:14px;margin-top:12px;cursor:pointer;box-shadow:0 0 25px #00e5ff88}
.footer{margin-top:18px;text-align:center}
.creator{border:1px solid #00e5ff33;background:#00e5ff0f;color:#00e5ff;padding:8px 18px;border-radius:20px;font-size:11px;text-decoration:none}
.popup{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;place-items:center;z-index:99}
.popup.show{display:grid}
.pop-box{background:#0a1430;border:2px solid #00e5ff;padding:28px;border-radius:20px;text-align:center;box-shadow:0 0 50px #00e5ff;max-width:320px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="header">
<div class="logo">● SYSTEM</div>
<div class="right">
<div class="setBtn" onclick="toggleTimeBox()">⏱ SET TIME</div>
<div class="timer" id="timer">LEFT: 24:00:00</div>
</div>
</div>

<div class="container">
<div class="title">DAILY QUEST</div>
<div class="sub" id="subText">SET YOUR OWN TIME & TARGET</div>

<div class="timeBox" id="timeBox">
<h4>⏰ TIME LIMIT SET KARO</h4>
<div class="timeInputs">
<input id="hoursIn" type="number" placeholder="Hours" min="0" max="99" value="24">
<input id="minsIn" type="number" placeholder="Mins" min="0" max="59" value="0">
<button onclick="setNewTime()">SET</button>
</div>
<p style="font-size:9px;color:#666;margin-top:6px">Ex: 2 hours = 2 likho, 30 min = 0 hour 30 min</p>
</div>

<div class="addBox">
<input id="newQuest" placeholder="Apna target likh... ex: Gym">
<button onclick="addQuest()">+ ADD</button>
</div>

<div class="bar"><div class="fill" id="fill"></div></div>
<div class="count" id="count">0/0 Completed</div>
<div id="list"></div>

<button class="btn" onclick="submitQ()">SUBMIT QUESTS ➤</button>
<div class="footer"><a class="creator" href="https://instagram.com/shiva_editx100" target="_blank">Created by @shiva_editx100 ✨</a></div>
</div>

<div class="popup" id="penaltyPop"><div class="pop-box" style="border-color:#ff2a2a;box-shadow:0 0 50px #ff2a2a"><h1 style="font-size:30px;color:#ff2a2a">PENALTY!</h1><p style="margin:12px 0;color:#aaa">Time khatam! Quest fail ho gaya</p><button class="btn" style="background:#ff2a2a" onclick="resetTimer()">RESTART TIMER</button></div></div>
<div class="popup" id="popup"><div class="pop-box"><h1 style="font-size:34px;color:#00e5ff">LEVEL UP!</h1><p style="margin:12px 0;color:#aaa" id="rankText">All Quest Done</p><button class="btn" onclick="closePop()">CONTINUE</button></div></div>

<script>
let quests = JSON.parse(localStorage.getItem('myQuests') || '["100 Pushups","Study 2 Hours","Code 1 Hour","Wake at 5 AM"]');
let done = JSON.parse(localStorage.getItem('myDone') || '[false,false,false,false]');
let totalSeconds = parseInt(localStorage.getItem('totalSec') || '86400');
let endTime = parseInt(localStorage.getItem('endTime') || '0');
if(done.length!=quests.length) done = quests.map(()=>false);
if(!endTime){ endTime = Date.now()+ totalSeconds*1000; localStorage.setItem('endTime',endTime); }

function save(){localStorage.setItem('myQuests',JSON.stringify(quests));localStorage.setItem('myDone',JSON.stringify(done));localStorage.setItem('totalSec',totalSeconds);localStorage.setItem('endTime',endTime);}
function render(){let h='';quests.forEach((q,i)=>{h+=`<div class="card ${done[i]?'done':''}"><div class="left"><div class="num">${String(i+1).padStart(2,'0')}</div><input class="name" value="${q}" onchange="editQuest(${i},this.value)"></div><div class="actions"><div class="check" onclick="toggle(${i})">✓</div><div class="del" onclick="deleteQuest(${i})">×</div></div></div>`});document.getElementById('list').innerHTML=h;updateBar();}
function updateBar(){let c=done.filter(x=>x).length;let t=quests.length;document.getElementById('fill').style.width=(t?c/t*100:0)+'%';document.getElementById('count').innerText=c+'/'+t+' Completed';}
function toggle(i){done[i]=!done[i];save();render();}
function addQuest(){let v=document.getElementById('newQuest').value.trim();if(!v)return alert('Pehle kuch likh!');quests.push(v);done.push(false);document.getElementById('newQuest').value='';save();render();}
function editQuest(i,val){quests[i]=val;save();}
function deleteQuest(i){if(confirm('Delete?')){quests.splice(i,1);done.splice(i,1);save();render();}}
function toggleTimeBox(){document.getElementById('timeBox').classList.toggle('show');}
function setNewTime(){let h=parseInt(document.getElementById('hoursIn').value||0);let m=parseInt(document.getElementById('minsIn').value||0);totalSeconds=h*3600+m*60;if(totalSeconds<60)return alert('Kam se kam 1 min toh daal!');endTime=Date.now()+totalSeconds*1000;save();toggleTimeBox();document.getElementById('subText').innerText=`TIME SET: ${h}H ${m}M`;}
function resetTimer(){endTime=Date.now()+totalSeconds*1000;save();document.getElementById('penaltyPop').classList.remove('show');}
function submitQ(){let c=done.filter(x=>x).length;if(quests.length==0)return alert('Pehle quest add kar!');if(c==quests.length){document.getElementById('rankText').innerText=`${c} Quest Done in Time! RANK A`;document.getElementById('popup').classList.add('show')}else{alert(`SYSTEM: ${c}/${quests.length} done, sab kar!`)}}
function closePop(){document.getElementById('popup').classList.remove('show');}

setInterval(()=>{
 let diff = endTime - Date.now();
 if(diff<=0){document.getElementById('timer').innerText='LEFT: 00:00:00';document.getElementById('penaltyPop').classList.add('show');return;}
 let sec=Math.floor(diff/1000);let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
 document.getElementById('timer').innerText=`LEFT: ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
},1000)

render();
</script>
</body>
</html>
